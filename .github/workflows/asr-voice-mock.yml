name: Voice and timeline mock checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/core/elevenlabs.ts'
      - 'src/core/timing.ts'
      - 'server/elevenlabs.ts'
      - 'tests/elevenlabs.test.ts'
      - 'tests/timing.test.ts'
      - 'tests/voice-ui.test.ts'
      - 'src/editor/VoicePanel.tsx'
      - 'src/editor/TimingPanel.tsx'
      - 'src/editor/Waveform.tsx'
      - '.github/workflows/asr-voice-mock.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx tsx --test tests/elevenlabs.test.ts tests/timing.test.ts tests/voice-ui.test.ts
