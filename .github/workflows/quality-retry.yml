name: A02 saved-project render retry
on:
  pull_request:
    branches: [main, 'a02/quick-runtime-gate']
    paths:
      - 'server/render.ts'
      - 'server/quality/**'
      - 'tests/quality*.test.ts'
      - 'scripts/quality-retry*.ts'
      - '.github/workflows/quality-retry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx tsx --test tests/quality*.test.ts
      - run: npx tsx scripts/quality-retry-fixture.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-retry-evidence
          path: out/quality-retry-fixture/
          if-no-files-found: warn
