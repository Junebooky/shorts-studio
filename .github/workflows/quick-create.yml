name: Topic to video browser acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quick-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.63.0
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - run: node --import tsx scripts/quick-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-browser-evidence
          path: out/quick-browser/
          if-no-files-found: warn
