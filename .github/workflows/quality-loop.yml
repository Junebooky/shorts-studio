name: A02 bounded review loop
on:
  pull_request:
    branches: [main, 'a02/quality-render']
    paths:
      - 'src/core/quality/**'
      - 'server/quality/**'
      - 'scripts/quality-loop.ts'
      - 'scripts/quality-layout-fixture.ts'
      - 'tests/quality*.test.ts'
      - '.github/workflows/quality-loop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx tsx --test tests/quality*.test.ts
      - run: npx tsx scripts/quality-layout-fixture.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-loop-fixture
          path: out/quality-layout-fixture/
          if-no-files-found: warn
