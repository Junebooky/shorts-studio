name: A02 QuickCreate downloaded MP4 integrity
on:
  pull_request:
    branches: [main, 'a01/topic-to-video']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  downloaded-mp4:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.63.0
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - run: node --import tsx scripts/quick-browser.mjs
      - run: npx tsx scripts/quality-quick-output.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-output-qa
          path: out/quick-browser/
          if-no-files-found: warn
