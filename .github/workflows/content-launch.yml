name: Unified content launch UI acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/workspace/**'
      - 'src/main.tsx'
      - 'src/App.tsx'
      - 'src/editor/QuickCreatePanel.tsx'
      - 'scripts/content-launch-browser.mjs'
      - '.github/workflows/content-launch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx tsx --test tests/content-plan.test.ts tests/content-progress.test.ts
      - run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.63.0
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - run: node scripts/content-launch-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-launch
          path: out/content-launch/
          if-no-files-found: warn
