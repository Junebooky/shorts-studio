name: Full length Korean quick voice render
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/full-length-voice-fixture.py'
      - 'scripts/full-length-quick-render.ts'
      - 'server/quick-create.ts'
      - 'server/elevenlabs.ts'
      - 'src/core/timing.ts'
      - '.github/workflows/full-length-voice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-length:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
      - run: python3 scripts/full-length-voice-fixture.py
      - run: npx tsx scripts/full-length-quick-render.ts
      - name: Independent decode and audio evidence
        run: |
          f=out/full-length-voice-fixture/draft.mp4
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,avg_frame_rate:format=duration -of json "$f" > out/full-length-voice-fixture/probe.json
          node -e "const p=require('./out/full-length-voice-fixture/probe.json'),m=require('./out/full-length-voice-fixture/report.json');if(!p.streams.some(s=>s.codec_name==='h264'&&s.width===1080&&s.height===1920&&s.avg_frame_rate==='30/1')||!p.streams.some(s=>s.codec_name==='aac')||Math.abs(Number(p.format.duration)-m.expectedFrames/m.fps)>.15)process.exit(1)"
          ffmpeg -v error -xerror -i "$f" -map 0:v:0 -map 0:a:0 -f null -
          ffmpeg -hide_banner -i "$f" -vn -af volumedetect -f null - 2> out/full-length-voice-fixture/audio-level.txt
          python3 -c "import re; s=open('out/full-length-voice-fixture/audio-level.txt').read(); m=re.search(r'mean_volume: (-?[0-9.]+) dB',s); assert m and -80<float(m[1])<-1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-length-voice-render-evidence
          path: out/full-length-voice-fixture/
          if-no-files-found: warn
