name: Local voice acceptance safety checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/local-voice-check.ts'
      - 'tests/local-voice-check.test.ts'
      - 'server/elevenlabs.ts'
      - 'src/core/elevenlabs.ts'
      - '.github/workflows/local-voice-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx tsx --test tests/local-voice-check.test.ts
      - run: npx tsx scripts/local-voice-check.ts
      - name: Verify actual CLI refuses live execution in CI
        run: |
          if npx tsx scripts/local-voice-check.ts --execute --accept-provider-cost; then
            echo 'Unexpected live-mode success'; exit 1
          fi
